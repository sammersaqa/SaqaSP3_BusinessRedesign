<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Legacy Lawn Care & Landscaping</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* GLOBAL STYLES */
    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f9fa;
      color: #333;
    }

    /* NAVBAR */
    .navbar-brand {
      font-weight: bold;
      font-size: 1.5rem;
    }

    .nav-link {
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .nav-link:hover {
      color: #d4edda;
    }

    /* HERO SECTION - RESPONSIVE */
    .hero-section {
      background-image: url('https://images.unsplash.com/photo-1558904541-efa843a96f01?w=1200');
      background-size: cover;
      background-position: center;
      min-height: 500px;
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
      position: relative;
    }

    .hero-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.3);
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .hero-section h1 {
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 700;
    }

    .hero-section .lead {
      font-size: clamp(1rem, 3vw, 1.25rem);
    }

    .hero-section .btn-success {
      background-color: #2e7d32;
      border: none;
      padding: 0.75rem 2rem;
      font-size: 1.1rem;
    }

    /* MODAL FORM */
    .modal-content {
      border-radius: 8px;
    }

    .modal-header {
      background-color: #2e7d32;
      color: #fff;
      border-bottom: none;
    }

    .modal-footer {
      border-top: none;
    }

    /* FOOTER */
    footer {
      background-color: #1b1b1b;
      font-size: 0.9rem;
    }

    footer p {
      margin: 0.3rem 0;
      font-size: clamp(0.8rem, 2vw, 0.9rem);
    }

    /* TABLET RESPONSIVE */
    @media (max-width: 991px) {
      .navbar-brand {
        font-size: 1.25rem;
      }
      
      .hero-section {
        min-height: 400px;
      }
    }

    /* MOBILE RESPONSIVE */
    @media (max-width: 576px) {
      .navbar-brand {
        font-size: 1.1rem;
      }

      .hero-section {
        min-height: 350px;
        padding: 2rem 1rem;
      }

      .hero-section .btn-success {
        padding: 0.6rem 1.5rem;
        font-size: 1rem;
        width: 100%;
      }

      footer p {
        font-size: 0.75rem;
        line-height: 1.6;
      }
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-success navbar-dark px-3 px-lg-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Legacy Lawn Care</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/pages/about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="/pages/services.html">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="/pages/contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<section class="hero-section d-flex align-items-center">
  <div class="container">
    <div class="row">
      <div class="col-12 col-md-10 col-lg-8 hero-content">
        <h1 class="mb-3">Stockton's Trusted Lawn Care Experts</h1>
        <p class="lead mb-4">Weekly services from $40. Reliable, professional, and locally owned.</p>
        <button class="btn btn-success btn-lg" data-bs-toggle="modal" data-bs-target="#quoteModal">Request a Quote</button>
      </div>
    </div>
  </div>
</section>

<div class="modal fade" id="quoteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Request a Quote</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="text" class="form-control mb-3" placeholder="Your Name" required />
        <input type="email" class="form-control mb-3" placeholder="Email Address" required />
        <textarea class="form-control mb-3" placeholder="Service Needed" rows="3" required></textarea>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-success">Submit</button>
        <button type="button" class="btn btn-outline-secondary" onclick="window.print()">Print</button>
      </div>
    </form>
  </div>
</div>

<footer id="contact" class="bg-dark text-white text-center py-4">
  <div class="container">
    <p class="mb-2">Email: LuisHernandez@LegacyLawnLLC.com | Phone: (209) 451-4550</p>
    <p class="mb-0">&copy; 2025 Legacy Lawn Care & Landscaping</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
